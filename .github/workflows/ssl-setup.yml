name: Setup SSL for quanlygiasan.io.vn

on:
  workflow_dispatch:

jobs:
  ssl-setup:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and configure nginx + certbot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            apt-get update -y
            apt-get install -y nginx certbot python3-certbot-nginx
            cat > /etc/nginx/sites-available/quanlygiasan.io.vn <<'EOF'
            server {
                listen 80;
                server_name quanlygiasan.io.vn www.quanlygiasan.io.vn;
                location / {
                    proxy_pass http://127.0.0.1:18790;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
            }
            EOF
            ln -sf /etc/nginx/sites-available/quanlygiasan.io.vn /etc/nginx/sites-enabled/quanlygiasan.io.vn
            nginx -t
            systemctl reload nginx || systemctl restart nginx
            certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d quanlygiasan.io.vn -d www.quanlygiasan.io.vn --redirect
            nginx -t
            systemctl reload nginx
            echo done
